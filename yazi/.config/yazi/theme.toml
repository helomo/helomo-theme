# Kazuha Dusk — yazi
#
# Sampled from ~/helomoTheme/kazuha.jpg, same palette as waybar/wofi/kitty.
#   base #141b28  surface #1d2739  overlay #3c485d  muted #7e8190
#   text #d6d2e0  bright  #f0e6ec  rose    #d6b8c8  pink  #e3b5cc
#   steel #8fa5c4 seafoam #8fb3ac  teal    #8fb8c4  amber #e0b088  coral #e08a94
#
# Verified against the default theme embedded in yazi 26.1.22, because yazi does
# NOT error on stale keys — it silently falls back to its default, which is how a
# wrong key looks identical to "the theme didn't load". Things that moved:
#   [manager] -> [mgr]        [select] -> [pick]        [completion] -> [cmp]
#   mgr.hovered         -> indicator.current
#   mgr.preview_hovered -> indicator.preview
#   filetype rules key `name` -> `url`

[mgr]
cwd = { fg = "#8fb8c4" }

find_keyword  = { fg = "#e0b088", bold = true, italic = true, underline = true }
find_position = { fg = "#e3b5cc", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#8fb3ac", bg = "#8fb3ac" }
marker_cut      = { fg = "#e08a94", bg = "#e08a94" }
marker_marked   = { fg = "#8fb8c4", bg = "#8fb8c4" }
marker_selected = { fg = "#e0b088", bg = "#e0b088" }

count_copied   = { fg = "#141b28", bg = "#8fb3ac" }
count_cut      = { fg = "#141b28", bg = "#e08a94" }
count_selected = { fg = "#141b28", bg = "#e0b088" }

border_symbol = "│"
border_style  = { fg = "#3c485d" }

# The row under the cursor. Without this yazi uses `reversed`, which paints the
# row in whatever the foreground happens to be (#d6d2e0) instead of the accent.
[indicator]
parent  = { fg = "#141b28", bg = "#b9b3c4" }
current = { fg = "#141b28", bg = "#d6b8c8", bold = true }
preview = { underline = true }

[tabs]
active   = { fg = "#141b28", bg = "#d6b8c8", bold = true }
inactive = { fg = "#d6b8c8", bg = "#1d2739" }

[mode]
normal_main = { fg = "#141b28", bg = "#d6b8c8", bold = true }
normal_alt  = { fg = "#d6b8c8", bg = "#1d2739" }

select_main = { fg = "#141b28", bg = "#8fb3ac", bold = true }
select_alt  = { fg = "#8fb3ac", bg = "#1d2739" }

unset_main  = { fg = "#141b28", bg = "#e0b088", bold = true }
unset_alt   = { fg = "#e0b088", bg = "#1d2739" }

[status]
overall = { fg = "#d6d2e0" }

# permission bits in the footer
perm_sep   = { fg = "#3c485d" }
perm_type  = { fg = "#8fb3ac" }
perm_read  = { fg = "#e0b088" }
perm_write = { fg = "#e08a94" }
perm_exec  = { fg = "#8fb8c4" }

progress_label  = { fg = "#f0e6ec", bold = true }
progress_normal = { fg = "#d6b8c8", bg = "#1d2739" }
progress_error  = { fg = "#e08a94", bg = "#1d2739" }

[which]
cols            = 3
mask            = { bg = "#1d2739" }
cand            = { fg = "#8fb8c4" }
rest            = { fg = "#7e8190" }
desc            = { fg = "#d6b8c8" }
separator       = "  "
separator_style = { fg = "#3c485d" }

[confirm]
border     = { fg = "#d6b8c8" }
title      = { fg = "#d6b8c8" }
body       = {}
list       = { fg = "#8fb8c4" }
btn_yes    = { fg = "#141b28", bg = "#d6b8c8", bold = true }
btn_no     = {}
btn_labels = [ "  Yes  ", "  (N)o  " ]

[spot]
border   = { fg = "#d6b8c8" }
title    = { fg = "#d6b8c8" }
tbl_col  = { fg = "#d6b8c8" }
tbl_cell = { fg = "#e3b5cc", reversed = true }

[notify]
title_info  = { fg = "#8fb3ac" }
title_warn  = { fg = "#e0b088" }
title_error = { fg = "#e08a94" }
icon_info   = ""
icon_warn   = ""
icon_error  = ""

[pick]
border   = { fg = "#d6b8c8" }
active   = { fg = "#e3b5cc", bold = true }
inactive = {}

[input]
border   = { fg = "#d6b8c8" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border       = { fg = "#d6b8c8" }
active       = { reversed = true }
inactive     = {}
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#d6b8c8" }
title   = {}
hovered = { fg = "#e3b5cc", underline = true }

[help]
on      = { fg = "#d6b8c8" }
run     = { fg = "#e3b5cc" }
desc    = { fg = "#d6d2e0" }
hovered = { bg = "#3c485d", bold = true }
footer  = { fg = "#141b28", bg = "#d6d2e0" }

[filetype]
rules = [
    # media
    { mime = "image/*", fg = "#d6b8c8" },
    { mime = "{audio,video}/*", fg = "#e0b088" },

    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e08a94" },

    # documents
    { mime = "application/{pdf,epub*,doc*,ms*,vnd.*,rtf}", fg = "#8fa5c4" },

    # data / code-adjacent
    { mime = "application/{json,x-ndjson,javascript,xml,x-yaml,toml}", fg = "#8fb8c4" },
    { mime = "text/*", fg = "#d6d2e0" },

    # executables & specials — the key is `url`, not `name`
    { url = "*", is = "exec", fg = "#8fb3ac" },
    { url = "*", is = "orphan", fg = "#f0e6ec", bg = "#e08a94" },
    { url = "*", is = "link", fg = "#8fb8c4" },
    { url = "*", is = "dummy", fg = "#f0e6ec", bg = "#e08a94" },
    { url = "*/", is = "dummy", fg = "#f0e6ec", bg = "#e08a94" },

    # directories, then the catch-all
    { url = "*/", fg = "#d6b8c8", bold = true },
    { url = "*", fg = "#d6d2e0" },
]

[icon]
# `dirs = []` drops yazi's per-name folder colours (.git teal, .config orange,
# Downloads teal…) so every folder icon falls through to the `dir` cond below and
# matches its rose label. `files`/`exts` are left at yazi's devicon defaults —
# per-language file icons are genuinely useful and reading them as "brand colour,
# not theme colour" is the convention.
dirs = []

# Glyphs are yazi 26.1.22's own defaults, recoloured. Overriding `conds` replaces
# the whole array, so every entry has to be repeated — dropping one loses its icon.
conds = [
    # Special files
    { if = "orphan", text = "", fg = "#e08a94" },
    { if = "link",   text = "", fg = "#8fb8c4" },
    { if = "block",  text = "", fg = "#e0b088" },
    { if = "char",   text = "", fg = "#e0b088" },
    { if = "fifo",   text = "", fg = "#e0b088" },
    { if = "sock",   text = "", fg = "#e0b088" },
    { if = "sticky", text = "", fg = "#e0b088" },
    { if = "dummy",  text = "", fg = "#e08a94" },

    # Fallback
    { if = "dir",  text = "", fg = "#d6b8c8" },
    { if = "exec", text = "", fg = "#8fb3ac" },
    { if = "!dir", text = "", fg = "#a098a9" },
]
