[Settings]
# Without this, GTK apps (file pickers, dolphin dialogs) open in stock light
# Adwaita against a dark desktop — which is why wofi had to force gtk_dark=true.
gtk-application-prefer-dark-theme=1
# Adwaita-dark is not a real theme directory on Arch without gnome-themes-extra;
# naming it here just made GTK fall back silently. GTK3 ships Adwaita built in
# and prefer-dark-theme above is the supported way to get its dark variant.
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
# Must be proportional: a mono font here sets the *entire* UI, file lists
# included, in monospace.
gtk-font-name=Adwaita Sans 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
