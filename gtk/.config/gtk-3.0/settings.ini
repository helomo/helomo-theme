[Settings]
# Without this, GTK apps (file pickers, dolphin dialogs) open in stock light
# Adwaita against a dark desktop — which is why wofi had to force gtk_dark=true.
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-font-name=Hack Nerd Font 10
gtk-cursor-theme-size=24
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
