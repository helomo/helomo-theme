[Settings]
# GTK4/libadwaita reads the same keys; the accent itself is set in gtk.css.
gtk-application-prefer-dark-theme=1
# See the note in gtk-3.0/settings.ini — Adwaita-dark is not an installed theme.
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
# Proportional, not the mono font used by kitty/yazi.
gtk-font-name=Adwaita Sans 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
