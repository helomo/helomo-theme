# Power menu (Waybar 󰐥 → waybar/scripts/powermenu.sh). Style: power.css
#
# The search entry is kept, but power.css restyles it into the "Power" title
# bar — wofi has no other way to draw a heading. Typing still filters.

show=dmenu
prompt=Power
width=260
# Snug around the content: 47px title block + 4 x 41px rows.
height=212
location=center

allow_markup=true
# Without this the pango spans are part of the searchable text, so typing "lo"
# matches every row via color=. parse_search strips markup from the filter key
# only — the string wofi echoes back is unchanged.
parse_search=true
# Plain GtkEntry instead of GtkSearchEntry: drops the magnifier and clear-text
# icons, which read as clutter in a title bar.
use_search_box=false
hide_scroll=true
no_actions=true
gtk_dark=true
insensitive=true
cache_file=/dev/null
