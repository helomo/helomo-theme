
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

# Kazuha Dusk palette. hyprlock.conf sources this too, so both stay in step —
# change a color once here instead of hunting it across the config.
source = ~/.config/hypr/colors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto
monitor=eDP-1,1920x1080@120,0x0,1.5
monitor=HDMI-A-1,1920x1080@120,auto-left,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = hyprpaper
exec-once = hypridle
# swaync, not hyprnotify: hyprnotify has no config file and no color options (its
# colors are compiled in, per urgency level), so notifications could never match the
# theme. swaync styles with GTK CSS, same as waybar and wofi.
# Falls back to hyprnotify so a machine without swaync still gets notifications
# rather than silently having no daemon at all.
exec-once = command -v swaync >/dev/null && swaync || hyprnotify
exec-once = waybar

# libadwaita (GTK4) ignores gtk-application-prefer-dark-theme in settings.ini —
# it only honours the org.gnome.desktop.interface gsetting, which lives in dconf
# and so isn't covered by stow. Setting it here keeps it version-controlled.
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# These must stay in sync with gtk/.config/gtk-{3,4}.0/settings.ini: portal and
# Flatpak clients read dconf first, and a disagreement shows up as a file chooser
# themed differently from the app that opened it. Adwaita, not Adwaita-dark —
# the latter needs gnome-themes-extra and otherwise falls back silently.
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface font-name 'Adwaita Sans 10'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec-once = ~/.config/waybar/scripts/waybar-fullscreen.sh




