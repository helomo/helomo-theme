#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $accent $accentAlt 45deg
    col.inactive_border = $inactive

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 5
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = $shadow
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        # size 3 / passes 1 was too weak to perceive — the wofi layerrule and
        # kitty's 0.5 opacity both looked unblurred. These give real frost.
        size = 6
        passes = 3

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Snappy with overshoot. `overshot` ends at y=1.05 and settles back, so windows
    # and workspaces spring slightly past their target instead of easing flat into it.
    # `snap` is the same feel without the bounce, for anything that shouldn't wobble.
    bezier = overshot,     0.05, 0.9,  0.1,  1.05
    bezier = snap,         0.2,  1.0,  0.2,  1.0
    bezier = almostLinear, 0.5,  0.5,  0.75, 1.0
    bezier = linear,       0, 0, 1, 1

    animation = global,           1, 8,   overshot
    animation = border,           1, 8,   snap
    # `once`, not `loop`: a looping borderangle animates the gradient forever and
    # burns laptop battery for a detail you stop noticing after a day.
    animation = borderangle,      1, 30,  linear, once

    animation = windows,          1, 4.5, overshot, popin 90%
    animation = windowsIn,        1, 4.5, overshot, popin 90%
    animation = windowsOut,       1, 3,   snap,     popin 90%
    animation = windowsMove,      1, 4,   snap

    animation = fade,             1, 3,   snap
    animation = fadeIn,           1, 2.5, almostLinear
    animation = fadeOut,          1, 2,   almostLinear

    # Covers wofi and Waybar both — this is what makes the fullscreen auto-hide
    # slide up out of the way instead of blinking out.
    animation = layers,           1, 3.5, overshot, slide top
    animation = layersIn,         1, 3.5, overshot, slide top
    animation = layersOut,        1, 2.5, snap,     slide top

    animation = workspaces,       1, 5,   overshot, slidefade 15%
    animation = specialWorkspace, 1, 5,   overshot, slidevert
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ara
    kb_variant =
    kb_model =
    # No grp: toggle here on purpose — xkb group state is per-device, so
    # grp:win_space_toggle only switched the keyboard that pressed the key,
    # leaving the other keyboards (and Waybar) on the old layout.
    # SUPER+SPACE is bound below to switch every keyboard at once instead.
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = 0
}

cursor {
    no_hardware_cursors = 1
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, firefox
bind = $mainMod, L, exec, ~/.config/hypr/scripts/lock.sh
bind = $mainMod, T, exec, fragments
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, R, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Cycle keyboard layout (us <-> ara) on ALL keyboards at once, so the internal
# keyboard, any USB keyboard, and the Waybar language island stay in sync.
bind = $mainMod, SPACE, exec, hyprctl switchxkblayout all next



########################
####Screenshot utils####
########################

# Screenshot full monitor with $mainMod + X
bind = $mainMod, X, exec, hyprshot -m output

# Screenshot active window with $mainMod + SHIFT + X
bind = $mainMod SHIFT, X, exec, hyprshot -m window

# Screenshot region with $mainMod + CTRL + X
bind = $mainMod CTRL, X, exec, hyprshot -m region

# Screenshot frozen region (menus etc) with $mainMod + ALT + X
bind = $mainMod ALT, X, exec, hyprshot -zm region --clipboard-only



# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

###################
### LAYER RULES ###
###################

# wofi is a translucent layer surface — frost it so the wallpaper stops
# fighting the text. Covers both the drun launcher (SUPER+R) and the Waybar
# power menu: wofi hardcodes the layer-shell namespace "wofi" for every mode.
#
# ignore_alpha skips pixels at or below that opacity, so the antialiased fringe
# outside the 14px CSS corner radius stays unblurred and the island doesn't sit
# in a square halo. Our lightest painted surface is alpha 0.55 (#input) over
# alpha 0.72 (#window), both well above 0.4.
#
# NOTE: 0.54 dropped the old one-line `layerrule = blur, <ns>` form — it errors
# with "invalid field blur: missing a value". This block syntax is the current
# one, and `ignore_alpha` is spelled with the underscore.
layerrule {
    name = wofi-blur
    match:namespace = ^(wofi)$
    blur = true
    ignore_alpha = 0.4
}

# Same treatment for swaync's toasts and control center — they paint at the same
# alpha as the wofi island (0.72 window / 0.55 inner), so the same 0.4 threshold
# keeps the rounded corners out of a square halo.
layerrule {
    name = swaync-blur
    match:namespace = ^(swaync-notification-window|swaync-control-center)$
    blur = true
    ignore_alpha = 0.4
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore fullscreen/maximize requests from apps

# windowrule {
#     name = no-fullscreen-all
#     match:class = .*
#     suppress_event = fullscreen
# }

# Firefox can't do what kitty does. In kitty (and the GTK apps) only the
# *background* carries alpha, so text stays fully opaque. A web page paints its
# own opaque background, so the only lever is window opacity — which dims the
# content too. At kitty's 0.78 a white page washes out to light mauve and text
# contrast drops badly.
#
# So: near-opaque while focused (readable), more translucent when it isn't
# (pretty). The two numbers are active, then inactive.
windowrule {
    name = firefox-opacity
    match:class = ^(firefox)$
    opacity = 0.95 0.85
}

# VS Code / VSCodium are Electron and have no background-transparency support of
# their own, so — like Firefox — this is window opacity and it dims the text too.
# Only a hint of translucency while focused: syntax highlighting is the whole
# point of an editor, and dimming it to kitty's 0.78 muddies every token colour.
windowrule {
    name = vscode-opacity
    match:class = ^(code|code-oss|Code|code-url-handler|VSCodium|codium)$
    opacity = 0.97 0.90
}

# Fix some dragging issues with XWayland
windowrule {
    name = xwayland-nofocus-fix
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:fullscreen = 0
    suppress_event = activatefocus
}