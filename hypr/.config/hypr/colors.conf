# Kazuha Dusk — the single source of truth for Hyprland + hyprlock colors.
#
# Every value here was sampled out of ~/helomoTheme/kazuha.jpg with ImageMagick
# (deep water, mid-slate, mauve sky band, blush sun) and then nudged for contrast.
# The CSS-based apps (waybar, wofi, swaync, gtk) can't `source` a hyprlang file —
# their palette is documented in README.md and must be kept in step by hand.
#
#   base    #141b28   surface #1d2739   overlay #3c485d
#   muted   #7e8190   subtext #a098a9   text    #d6d2e0   bright #f0e6ec
#   rose    #d6b8c8   mauve   #b9b3c4   blush   #f7c9cc   plum   #6b5a70
#   steel   #8fa5c4   sky     #a9b8d4   seafoam #8fb3ac   teal   #8fb8c4
#   amber   #e0b088   coral   #e08a94   pink    #e3b5cc

# --- hyprland: hex + alpha, no leading '#' ---
$base      = rgba(141b28ff)
$accent    = rgba(d6b8c8ee)
$accentAlt = rgba(b9b3c4ee)
$inactive  = rgba(3c485daa)
$shadow    = rgba(0e141fdd)

# --- hyprlock: decimal rgba ---
$cBg       = rgba(14, 20, 31, 0.85)
$cAccent   = rgba(214, 184, 200, 0.95)
$cText     = rgba(214, 210, 224, 0.95)
$cMuted    = rgba(160, 152, 169, 0.85)
$cSurface  = rgba(29, 39, 57, 0.55)
$cRing     = rgba(214, 184, 200, 0.65)
