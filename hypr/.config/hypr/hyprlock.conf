# Kazuha Dusk palette — shared with hyprland.conf so the lock screen and the
# desktop can't drift apart. $cAccent/$cText/$cMuted/$cSurface/$cBg/$cRing live there.
source = ~/.config/hypr/colors.conf

general {
  # `grace` is a CLI flag in 0.9.6 (--grace), not a config option; it errored
  # here and was ignored. The default is 0, which is what we want anyway.
  ignore_empty_input = true  # Enter on an empty field shouldn't burn a fail_timeout
}

background {
  monitor = eDP-1
  path = /home/helomo/helomoTheme/kazuha.jpg
  blur_passes = 3
  brightness = 0.55
  contrast = 1.1
  color = $cBg
}


background {
  monitor = HDMI-A-1
  path = /home/helomo/helomoTheme/kazuha.jpg
  blur_passes = 3
  brightness = 0.55
  contrast = 1.1
  color = $cBg
}


# Profie-Photo
image {
    monitor = eDP-1
    path = /home/helomo/helomoTheme/helomo_pic.jpg
    border_size = 2
    border_color = $cRing
    size = 65
    rounding = -1
    rotate = 0
    position = 720, 475
    halign = center
    valign = center
}

# USER
label {
    monitor = eDP-1
    text = $USER
    color = $cText
    font_size = 18
    font_family = BigBlueTermPlus Nerd Font
    position = 825, 475
    halign = center
    valign = center
}


# TIME (HH)
label {
  monitor = eDP-1
  text = cmd[update:1000] echo "$(date '+%I')"
  font_size = 100
  font_family = BigBlueTermPlus Nerd Font 
  position = 0, 210  # Above center
  color = $cAccent
}
# TIME (MM)
label {
  monitor = eDP-1
  text = cmd[update:1000] echo "$(date '+%M')"
  font_size = 100
  font_family = BigBlueTermPlus Nerd Font 
  position = 0, 90  # Above center
  color = $cAccent
}

# DATE (e.g., Sun 08 Jun 2025)
label {
  monitor = eDP-1
  text = cmd[update:60000] echo "$(date '+%a %d %b')"
  font_size = 26
  font_family = BigBlueTermPlus Nerd Font
  position = 0, 0   # At the center
  color = $cText
}



input-field {
  monitor = eDP-1
  size = 300,40
  position = 0,-250
  dots_size = 0.3
  fade_on_empty = false  # Default true hides the field after 2s — the whole
                         # point is that it's visible before you start typing
  placeholder_text = <i>Enter Password...</i>
  font_family = BigBlueTermPlus Nerd Font
  font_color = $cText
  outer_color = $cAccent
  inner_color = $cSurface
  outline_thickness = 2

  # A stuck Caps Lock and a rejected password used to look exactly like a
  # typo. The ring goes coral for either, and a failure says why plus how
  # many tries in.
  capslock_color = $cWarn
  numlock_color = $cWarn
  bothlock_color = $cWarn
  invert_numlock = false
  swap_font_color = false
  fail_color = $cWarn
  fail_text = <i>$FAIL  ·  attempt $ATTEMPTS</i>
  check_text = <i>Checking...</i>
}

# KEYBOARD LAYOUT — the Waybar language island is hidden behind the lock
# surface, so mirror it here: same 󰌌 glyph, same pink. lock.sh pins the group
# to us before hyprlock starts, so this should always read EN.
label {
  monitor = eDP-1
  text = 󰌌  $LAYOUT[EN,AR]
  color = $cLayout
  font_size = 16
  font_family = BigBlueTermPlus Nerd Font
  position = 0, -310
  halign = center
  valign = center
}


# --- HDMI-A-1 ---------------------------------------------------------------
# The external monitor used to show nothing but the blurred wallpaper: no
# clock, no input field. Mirror the essentials so the password can be typed
# while looking at either screen — both input-fields share one buffer. The
# profile photo, battery, volume and mpris stack stay laptop-only.

# TIME (HH)
label {
  monitor = HDMI-A-1
  text = cmd[update:1000] echo "$(date '+%I')"
  font_size = 100
  font_family = BigBlueTermPlus Nerd Font
  position = 0, 210
  color = $cAccent
}
# TIME (MM)
label {
  monitor = HDMI-A-1
  text = cmd[update:1000] echo "$(date '+%M')"
  font_size = 100
  font_family = BigBlueTermPlus Nerd Font
  position = 0, 90
  color = $cAccent
}

# DATE
label {
  monitor = HDMI-A-1
  text = cmd[update:60000] echo "$(date '+%a %d %b')"
  font_size = 26
  font_family = BigBlueTermPlus Nerd Font
  position = 0, 0
  color = $cText
}

input-field {
  monitor = HDMI-A-1
  size = 300,40
  position = 0,-250
  dots_size = 0.3
  fade_on_empty = false  # Default true hides the field after 2s — the whole
                         # point is that it's visible before you start typing
  placeholder_text = <i>Enter Password...</i>
  font_family = BigBlueTermPlus Nerd Font
  font_color = $cText
  outer_color = $cAccent
  inner_color = $cSurface
  outline_thickness = 2

  capslock_color = $cWarn
  numlock_color = $cWarn
  bothlock_color = $cWarn
  invert_numlock = false
  swap_font_color = false
  fail_color = $cWarn
  fail_text = <i>$FAIL  ·  attempt $ATTEMPTS</i>
  check_text = <i>Checking...</i>
}

# KEYBOARD LAYOUT
label {
  monitor = HDMI-A-1
  text = 󰌌  $LAYOUT[EN,AR]
  color = $cLayout
  font_size = 16
  font_family = BigBlueTermPlus Nerd Font
  position = 0, -310
  halign = center
  valign = center
}
# ----------------------------------------------------------------------------


# Battery
label {
    monitor = eDP-1
    text = cmd[update:5s] /home/helomo/.config/hypr/scripts/battery.sh
    font_family = BigBlueTermPlus Nerd Font
    font_size = 18
    text_align= left
    color = $cText
    position = -840, 475
}

# Volume
label {
    monitor = eDP-1
    text = cmd[update:5s] /home/helomo/.config/hypr/scripts/volume.sh
    text_align= left
    position = -700, 475
    font_family = BigBlueTermPlus Nerd Font
    font_size = 18
    color = $cText
}

# Music
image {
    monitor = eDP-1
    path = 
    size = 120  # was 90
    rounding = 5
    border_size = 0
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/playerctlock.sh --arturl
    position = -270, -475  # moved further down to account for larger image
    halign = center
    valign = center
    # No `opacity` key on image{} in 0.9.6 — it errored and was ignored, so the
    # art has always drawn fully opaque. There is no replacement.
}

# PLAYER TITLE
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/playerctlock.sh --title)"
    color = $cAccent
    font_size = 20  # was 15
    font_family = BigBlueTermPlus Nerd Font Bold
    position = 810, -440
    halign = left
    valign = center
}

# PLAYER ARTIST
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/playerctlock.sh --artist)"
    color = $cMuted
    font_size = 18  # was 12
    font_family = BigBlueTermPlus Nerd Font
    position = 810, -475
    halign = left
    valign = center
}

# PLAYER ALBUM
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/playerctlock.sh --album)"
    color = $cText
    font_size = 16  # was 12
    font_family = BigBlueTermPlus Nerd Font
    position = 810, -510
    halign = left
    valign = center
}

# PLAYER STATUS
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/playerctlock.sh --status)"
    color = $cText
    font_size = 22  # was 16
    font_family = BigBlueTermPlus Nerd Font
    position = -470, -440
    halign = right
    valign = center
}

# PLAYER LENGTH
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/playerctlock.sh --length) "
    color = $cText
    font_size = 18  # was 13
    font_family = BigBlueTermPlus Nerd Font
    position = -470, -475
    halign = right
    valign = center
}

# PLAYER SOURCE
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/playerctlock.sh --source)"
    color = $cMuted
    font_size = 16  # was 12
    font_family = BigBlueTermPlus Nerd Font
    position = -470, -510
    halign = right
    valign = center
}
