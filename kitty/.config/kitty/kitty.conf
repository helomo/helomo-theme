# Kazuha Dusk — sampled from ~/helomoTheme/kazuha.jpg.
# Kept in step by hand with waybar/wofi/swaync CSS and hypr/colors.conf.

# 0.78, matching the Waybar capsules. kazuha.jpg's sky is bright enough that the
# old 0.5 washed the navy out to srgb(105,101,116) — a mid mauve you can't read
# code on. Lower it if you want more wallpaper showing through.
background_opacity 0.78
background            #141b28
foreground            #d6d2e0

cursor                #d6b8c8
cursor_text_color     #141b28

selection_background  #6b5a70
selection_foreground  #f0e6ec

url_color             #8fa5c4

active_border_color   #d6b8c8
inactive_border_color #3c485d
bell_border_color     #e08a94

# 16-colour ANSI palette. Everything that renders through a terminal — ls, git,
# grep, bat, yazi's fallbacks — picks its colours from these slots, so without
# them the whole terminal falls back to kitty's stock (very saturated) defaults.
# normal
color0  #2a3346
color1  #d97f8a
color2  #8fb3ac
color3  #d9a97e
color4  #8fa5c4
color5  #c9a3bc
color6  #8fb8c4
color7  #c8c5d4
# bright
color8  #4a566b
color9  #e69aa3
color10 #a6c7c0
color11 #e8c39a
color12 #a9bcd8
color13 #dbb8ce
color14 #a9cdd8
color15 #f0e6ec

# tabs
active_tab_background   #d6b8c8
active_tab_foreground   #141b28
active_tab_font_style   bold
inactive_tab_background #1d2739
inactive_tab_foreground #7e8190
tab_bar_background      #141b28

font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
map shift+enter send_text all \e\r
